<script>
(function () {
  var NAV_MS = 200;

  function fire(name, props, go) {
    var moved = false;
    function once() { if (moved) { return; } moved = true; if (go) { go(); } }
    try {
      window.plausible(name, { props: props, callback: once });
    } catch (e) {
      once();
      return;
    }
    if (go) { window.setTimeout(once, NAV_MS); }
  }

  // Best-effort device hint, not a compatibility check. Added 7 November 2026 so a
  // Windows visitor taking the Mac file is visible in the numbers, which the audit
  // asked for. Computed once per page rather than per click.
  var OS = (function () {
    try {
      var d = navigator.userAgentData;
      if (d && d.platform) {
        var q = d.platform.toLowerCase();
        if (q.indexOf('win') === 0) { return 'windows'; }
        if (q.indexOf('mac') === 0) { return 'mac'; }
        if (q.indexOf('android') === 0) { return 'android'; }
      }
      var u = navigator.userAgent || '';
      if (/iPhone|iPad|iPod/i.test(u)) { return 'ios'; }
      if (/Android/i.test(u)) { return 'android'; }
      if (/Macintosh|Mac OS X/i.test(u)) { return 'mac'; }
      if (/Windows/i.test(u)) { return 'windows'; }
    } catch (e) { /* fall through */ }
    return 'other';
  })();

  function props(el) {
    var p = {};
    var where = el.getAttribute('data-ev-where');
    if (where) { p.location = where; }
    // Only on downloads. Adding it everywhere would change the shape of events that
    // already have history behind them.
    var name = el.getAttribute('data-ev') || '';
    if (name.indexOf('Download') === 0) { p.os = OS; }
    return p;
  }

  document.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.button !== 0) { return; }
    var t = e.target;
    if (!t || !t.closest) { return; }
    var el = t.closest('[data-ev]');
    if (!el) { return; }
    var name = el.getAttribute('data-ev');
    if (!name) { return; }

    // A new tab or window leaves this page loaded, so the event survives on its own and
    // the browser should be left to do what the visitor asked.
    var newTab = e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || el.target === '_blank';
    var href = el.getAttribute('href');
    if (newTab || !href || href.charAt(0) === '#') {
      fire(name, props(el), null);
      return;
    }

    e.preventDefault();
    var dest = el.href;
    fire(name, props(el), function () { window.location.href = dest; });
  }, false);

  // Counted once per page view. Scrubbing or replaying is not a second conversion.
  var vids = document.querySelectorAll('video[data-ev]');
  for (var i = 0; i < vids.length; i++) {
    (function (v) {
      var sent = false;
      v.addEventListener('play', function () {
        if (sent) { return; }
        sent = true;
        fire(v.getAttribute('data-ev'), props(v), null);
      });
    })(vids[i]);
  }
})();
</script>
<script>
(function () {
  function sync() {
    var tables = document.querySelectorAll('table.cmp');
    for (var i = 0; i < tables.length; i++) {
      var t = tables[i];
      var needs = t.scrollWidth > t.clientWidth + 1;
      var prev = t.previousElementSibling;
      var has = prev && prev.className === 'swipe';
      if (needs && !has) {
        var p = document.createElement('p');
        p.className = 'swipe';
        p.textContent = 'Swipe to compare \u2192';
        t.parentNode.insertBefore(p, t);
      } else if (!needs && has) {
        prev.parentNode.removeChild(prev);
      }
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', sync);
  } else {
    sync();
  }
  window.addEventListener('resize', sync);
  window.addEventListener('orientationchange', sync);
})();
</script>
